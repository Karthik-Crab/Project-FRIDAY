[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "friday"
version = "0.1.0.dev0"
description = "FRIDAY - personal AI desktop companion (backend core)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real-hardware voice stack (Windows target). Not required for tests.
voice = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
]
secrets = ["keyring>=24"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
friday = "friday.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]  # tests unpack a shared harness tuple

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["friday"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "kokoro_onnx", "keyring"]
ignore_missing_imports = true
