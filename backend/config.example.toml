# FRIDAY configuration. Copy to:
#   Windows: %APPDATA%\FRIDAY\config.toml
#   other:   ~/.config/friday/config.toml     (or set FRIDAY_CONFIG)
#
# NO SECRETS IN THIS FILE. API keys live in Windows Credential Manager:
#   python -c "import keyring; keyring.set_password('friday', 'anthropic', input('key: '))"
# or, for development only, in environment variables FRIDAY_<NAME>_API_KEY
# (e.g. FRIDAY_ANTHROPIC_API_KEY).

user_name = "Karthik"
default_mode = "companion"   # or "work"
offline = false              # true = never call cloud providers
log_level = "INFO"

# ---- providers: named instances of an adapter kind -----------------------

[providers.local]
kind = "ollama"
model = "llama3.2:3b"        # small enough to answer quickly on a CPU-only laptop

[providers.claude]
kind = "anthropic"
model = "<anthropic-model-id>"   # set to a current model id
api_key_name = "anthropic"

[providers.openai]
kind = "openai"
model = "<openai-model-id>"      # set to a current model id
api_key_name = "openai"

# Gemini via its OpenAI-compatible endpoint (a native adapter is planned):
# [providers.gemini]
# kind = "openai"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "<gemini-model-id>"
# api_key_name = "gemini"

# ---- routes: purpose -> ordered providers (first healthy one wins) -------
# Companion mode uses "conversation", work mode uses "reasoning".
# The "offline" route is always appended as the last resort.

[routes]
conversation = ["openai", "local"]
reasoning = ["claude", "local"]
default = ["local"]
offline = ["local"]

# ---- voice ---------------------------------------------------------------

[voice]
stt_model = "base.en"            # fast on a laptop CPU; "small.en" is more accurate but ~3x slower
# stt_cpu_threads = 8            # default: one per physical core, up to 8
# stt_vocabulary = ["Risk Crawler"]   # names and jargon it should recognise
stt_device = "cpu"               # no NVIDIA GPU: CPU with int8 is the fast path
stt_compute_type = "int8"
tts_model_path = "models/kokoro-v1.0.onnx"
tts_voices_path = "models/voices-v1.0.bin"
tts_voice = "af_heart"
tts_speed = 1.0
sentence_pause_ms = 250   # breath between spoken pieces; lower = more hurried
max_chunk_chars = 300     # sentences ready together are voiced as one piece, up to this size
end_silence_ms = 700             # pause length that ends your turn
barge_in_min_ms = 300            # how long you must speak to interrupt
# speech_threshold_while_speaking = 0.6   # check your mic with: friday mic
min_speech_db = -50              # quieter than this is never speech (other voices, TV)
max_merges = 2                   # restarts allowed if you speak again before the reply
acknowledgements = ["Hmm.", "Okay."]   # thinking sounds in companion mode; [] turns them off
# input_device = 1               # see: python -m sounddevice
# output_device = 3

# ---- realtime: optional speech-to-speech voice (friday voice --realtime) ---
# One model listens and speaks directly: the most natural-sounding option, but
# it needs internet and is billed per minute of audio on your OpenAI API account
# (separate from a ChatGPT subscription). Uses the key stored as "openai".

[realtime]
model = "gpt-realtime"
voice = "marin"
turn_detection = "semantic_vad"   # waits for you to finish your thought

# ---- claude_code: optional, pass spoken tasks on to Claude Code ------------
# "Friday, ask Claude Code to ..." -> she reads it back -> you say yes -> it
# runs in the background and she tells you the outcome. Needs Claude Code
# installed and signed in on this machine (it uses that login, no API key).

[claude_code]
enabled = false
project_dir = ""                 # the folder Claude Code works in, e.g. "C:/Users/you/Projects/my-app"
permission_mode = ""             # "" = Claude Code's own settings; "plan" = read and propose only;
                                 # "acceptEdits" = may change files in that folder
keep_session = "day"             # every task continues one Claude Code chat: "run" = until FRIDAY
                                 # closes, "day" = until midnight, "always" = until you say
                                 # "Friday, new Claude Code chat"

# ---- memory: notes kept between sessions, shared with Claude Code ---------
# "Friday, remember that ..." saves a line, word for word, in memory.md.
# Every task passed to Claude Code is added to worklog.md with its outcome.
# She is shown both at the start of each session, and Claude Code gets them
# with a task. They are plain text: open, edit or delete them any time.
# Do not have her remember passwords or keys.

[memory]
enabled = true
folder = ""                      # "" = a "memory" folder next to this file
max_chars = 1200                 # how much she is shown; more makes her slower to start
also_read = []                   # other files to show her, e.g. ["C:/Users/you/Projects/app/CLAUDE.md"]
share_with_claude_code = true    # pass the notes to Claude Code along with a task
