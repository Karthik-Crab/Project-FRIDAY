# FRIDAY configuration. Copy to:
#   Windows: %APPDATA%\FRIDAY\config.toml
#   other:   ~/.config/friday/config.toml     (or set FRIDAY_CONFIG)
#
# NO SECRETS IN THIS FILE. API keys live in Windows Credential Manager:
#   python -c "import keyring; keyring.set_password('friday', 'anthropic', input('key: '))"
# or, for development only, in environment variables FRIDAY_<NAME>_API_KEY
# (e.g. FRIDAY_ANTHROPIC_API_KEY).

user_name = "Karthik"
default_mode = "companion"   # or "work"
offline = false              # true = never call cloud providers
log_level = "INFO"

# ---- providers: named instances of an adapter kind -----------------------

[providers.local]
kind = "ollama"
model = "llama3.2:3b"        # small enough to answer quickly on a CPU-only laptop
# Ollama only:
# num_ctx = 8192             # how much of the chat (and attached documents) it reads at once
# think = false              # Qwen3 and other thinking models: answer straight away

# A model that can see, for pictures attached in the chat app (route "vision").
# [providers.vision]
# kind = "ollama"
# model = "gemma3:4b"

[providers.claude]
kind = "anthropic"
model = "<anthropic-model-id>"   # set to a current model id
api_key_name = "anthropic"

[providers.openai]
kind = "openai"
model = "<openai-model-id>"      # set to a current model id
api_key_name = "openai"

# Gemini via its OpenAI-compatible endpoint (a native adapter is planned):
# [providers.gemini]
# kind = "openai"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "<gemini-model-id>"
# api_key_name = "gemini"

# ---- routes: purpose -> ordered providers (first healthy one wins) -------
# Companion mode uses "conversation", work mode uses "reasoning".
# The "offline" route is always appended as the last resort.

[routes]
conversation = ["openai", "local"]
reasoning = ["claude", "local"]
default = ["local"]
offline = ["local"]
# vision = ["vision"]        # without this route, attached pictures can't be read

# ---- voice ---------------------------------------------------------------

[voice]
stt_model = "base.en"            # fast on a laptop CPU; "small.en" is more accurate but ~3x slower
# stt_cpu_threads = 8            # default: one per physical core, up to 8
# stt_beam_size = 5              # fewer misheard words, somewhat slower (default 1)
# Compare models without editing this file:  friday listen --model small.en
# stt_vocabulary = ["Risk Crawler"]   # names and jargon it should recognise
stt_device = "cpu"               # no NVIDIA GPU: CPU with int8 is the fast path
stt_compute_type = "int8"
tts_model_path = "models/kokoro-v1.0.onnx"
tts_voices_path = "models/voices-v1.0.bin"
tts_voice = "af_heart"
tts_speed = 1.0
# An expressive voice (laughs, sighs) from backend/servers/chatterbox_server.py,
# for a PC with an NVIDIA card. Used first; the voice above is the fallback.
# Must be on this machine. See docs/SETUP_NOBARA.md, stage 15.
# tts_server_url = "http://127.0.0.1:5005"
sentence_pause_ms = 250   # breath between spoken pieces; lower = more hurried
max_chunk_chars = 300     # sentences ready together are voiced as one piece, up to this size
end_silence_ms = 700             # pause length that ends your turn
barge_in_min_ms = 300            # how long you must speak to interrupt
# speech_threshold_while_speaking = 0.6   # check your mic with: friday mic
min_speech_db = -50              # quieter than this is never speech (other voices, TV)
max_merges = 2                   # restarts allowed if you speak again before the reply
acknowledgements = ["Hmm.", "Okay."]   # thinking sounds in companion mode; [] turns them off
# input_device = 1               # see: python -m sounddevice
# output_device = 3

# ---- realtime: optional speech-to-speech voice (friday voice --realtime) ---
# One model listens and speaks directly: the most natural-sounding option, but
# it needs internet and is billed per minute of audio on your OpenAI API account
# (separate from a ChatGPT subscription). Uses the key stored as "openai".

[realtime]
model = "gpt-realtime"
voice = "marin"
turn_detection = "semantic_vad"   # waits for you to finish your thought

# ---- claude_code: optional, pass spoken tasks on to Claude Code ------------
# "Friday, ask Claude Code to ..." -> she reads it back -> you say yes -> it
# runs in the background and she tells you the outcome. Needs Claude Code
# installed and signed in on this machine (it uses that login, no API key).

[claude_code]
enabled = false
project_dir = ""                 # the folder Claude Code works in, e.g. "C:/Users/you/Projects/my-app"
permission_mode = ""             # "" = Claude Code's own settings; "plan" = read and propose only;
                                 # "acceptEdits" = may change files in that folder
keep_session = "day"             # every task continues one Claude Code chat: "run" = until FRIDAY
                                 # closes, "day" = until midnight, "always" = until you say
                                 # "Friday, new Claude Code chat"

# ---- memory: notes kept between sessions, shared with Claude Code ---------
# "Friday, remember that ..." saves a line, word for word, in memory.md.
# Every task passed to Claude Code is added to worklog.md with its outcome.
# She is shown both at the start of each session, and Claude Code gets them
# with a task. They are plain text: open, edit or delete them any time.
# Do not have her remember passwords or keys.

[memory]
enabled = true
folder = ""                      # "" = a "memory" folder next to this file
max_chars = 1200                 # how much she is shown; more makes her slower to start
also_read = []                   # other files to show her, e.g. ["C:/Users/you/Projects/app/CLAUDE.md"]
share_with_claude_code = true    # pass the notes to Claude Code along with a task

# ---- studio: optional, make pictures and music with ComfyUI ---------------
# "Friday, make a picture of ..." or "compose a song about ..." -> she reads
# it back -> you say yes -> ComfyUI makes it in the background, the file is
# saved and opened, and she tells you when it is ready. "Cancel the picture"
# stops it. Test without voice:  friday make image "a fox in the snow"

[studio]
enabled = false
comfyui_url = "http://127.0.0.1:8188"   # this machine only (ComfyUI has no login)
comfyui_command = []             # started when needed, e.g. ["comfy", "--workspace", "~/ComfyUI", "launch"]
output_dir = ""                  # "" = Pictures/FRIDAY and Music/FRIDAY in your home folder
open_results = true
gpu_providers = []               # talking models on the graphics card, e.g. ["gpu"]: unloaded
                                 # during a job; she talks through the next one in her route
gpu_occasional = []              # graphics-card models used now and then, e.g. ["vision"]:
                                 # set aside during a job, not loaded again afterwards
image_workflow = ""              # "" = built-in SDXL text-to-image, or an API-format workflow
                                 # file (Workflow > Export (API)) with {{prompt}} where the words go
image_checkpoint = "Juggernaut-XL_v9_RunDiffusionPhoto_v2.safetensors"
image_width = 1024
image_height = 1024
image_steps = 30
music_checkpoint = ""            # e.g. "ace_step_1.5_turbo_aio.safetensors" turns on music (ACE-Step 1.5)
music_workflow = ""              # or an API-format workflow with {{prompt}}, {{lyrics}}, {{seconds}}
music_seconds = 30
music_lyrics = "[instrumental]"
music_bpm = 110
music_key = "C major"

# ---------------------------------------------------------------------------
# The chat app: `friday app` opens it in the browser (this computer only).
# Saved chats: conversations.db next to this file.
# ---------------------------------------------------------------------------
[app]
port = 8765
open_browser = true
ffmpeg = ""                      # "" = find ffmpeg on the PATH; needed for "add some bass" to a song
document_chars = 14000           # how much of an attached document goes to the model
                                 # (about 4 characters per token: keep below num_ctx)

# To let the app start the expressive voice only while voice mode is on, add
# under [voice] (adjust the paths):
# tts_server_command = ["~/local-ai/chatterbox-venv/bin/python", "~/local-ai/Project-FRIDAY/backend/servers/chatterbox_server.py", "--device", "cuda", "--port", "5005"]
# tts_server_env = { HF_HOME = "/mnt/studio/huggingface", HF_HUB_OFFLINE = "1" }

# ---------------------------------------------------------------------------
# AI changes to songs attached in the chat app: add an instrument part
# ("add a funky bass line"), pull one out ("just the vocals"), a new style
# ("make it a jazz version"), or redo a stretch ("redo 0:30 to 0:45 with a
# guitar solo"). Needs ACE-Step 1.5 (github.com/ace-step/ACE-Step-1.5)
# installed separately, with its base model (acestep-v15-base). FRIDAY starts
# its server when needed and stops it afterwards. 127.0.0.1 only.
# ---------------------------------------------------------------------------
[song_ai]
enabled = false
url = "http://127.0.0.1:8001"
# command = ["/path/to/ACE-Step-1.5/.venv/bin/acestep-api"]
# ACE-Step looks for its models in ACESTEP_PROJECT_ROOT/checkpoints. The
# memory setting lets the base model fit an 8 GB card (measured: 7.5 GB peak).
# env = { ACESTEP_CONFIG_PATH = "acestep-v15-base", ACESTEP_INIT_LLM = "false", ACESTEP_OFFLOAD_TO_CPU = "true", ACESTEP_PROJECT_ROOT = "/path/to/ACE-Step-1.5", PYTORCH_ALLOC_CONF = "expandable_segments:True" }
model = "acestep-v15-base"
steps = 50                       # more: better and slower
stop_after = true                # stop the server after each change (gives its memory back)

# Taking the singing out of songs (or keeping only the singing) with Demucs.
# [vocals]
# enabled = true
# command = ["/path/to/demucs/.venv/bin/python", "-m", "demucs.separate"]
# model = "htdemucs"
# device = "cpu"    # "cuda" is faster but needs the graphics card
